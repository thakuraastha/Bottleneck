[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bottleneck-ai"
version = "0.1.0"
description = "Multi-agent supply-chain disruption and recovery system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agents = [
  "a2a-sdk==0.3.26",
  "google-adk>=2.10,<3",
  "google-api-core==2.28.1",
  "crewai>=1.15,<2",
  "litellm>=1.60,<2",
  "mcp>=1.28,<2",
]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q"
